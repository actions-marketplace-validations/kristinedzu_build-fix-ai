name: 'BuildFix AI CI Failure Explainer'
description: 'Explains failed CI builds in plain English: likely root cause, related commits, and a suggested fix posted to the PR.'
author: 'kristinedzu'
branding:
  icon: 'search'
  color: 'purple'

inputs:
  log-file:
    description: 'Path to the failing CI log file generated by the build or test step.'
    required: true
  github-token:
    description: 'GitHub token with pull-requests: write permissions.'
    required: false
    default: ${{ github.token }}
  repo:
    description: 'Repository in owner/repo format. Defaults to the current repository.'
    required: false
    default: ${{ github.repository }}
  pr-number:
    description: 'Pull request number to comment on. Defaults to the current PR number.'
    required: false
    default: ${{ github.event.pull_request.number }}

runs:
  using: 'node20'
  main: 'src/index.js'
