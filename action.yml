name: 'CI Failure Investigator'
description: 'Analyzes failed CI logs, identifies likely root cause, and posts a readable PR summary.'
branding:
  icon: 'activity'
  color: 'purple'

inputs:
  log-file:
    description: 'Path to the failing CI log file generated by the build or test step.'
    required: true
  github-token:
    description: 'GitHub token with pull-requests: write permissions.'
    required: true
  repo:
    description: 'Repository in owner/repo format. Defaults to the current repository.'
    required: false
    default: ${{ github.repository }}
  pr-number:
    description: 'Pull request number to comment on. Defaults to the current PR number.'
    required: false
    default: ${{ github.event.pull_request.number }}

runs:
  using: 'node20'
  main: 'src/index.js'
